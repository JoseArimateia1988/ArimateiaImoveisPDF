<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#152b22"><title>Redefinir senha | Busca Certa</title>
<style>
:root{--green:#152b22;--cream:#fbf6ee;--paper:#fffdf8;--terra:#c66b3f;--ink:#1f2924;--muted:#6f756f;--line:#ddd2c3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink)}
.card{width:min(380px,calc(100% - 32px));background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:32px 28px}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:22px;color:var(--green);margin:0 0 6px}
p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 20px}
label{display:block;font-size:11px;font-weight:700;color:var(--green);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);font-size:14px;margin-bottom:14px;font-family:inherit}
button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--terra);color:#fff;font-weight:800;font-size:13px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{font-size:12px;margin-top:12px;min-height:16px}
.msg.erro{color:#a13b2b}
.msg.ok{color:#1f6b3e}
</style>
</head>
<body>
<div class="card">
  <h1>Crie uma nova senha</h1>
  <p>Escolha uma senha com pelo menos 8 caracteres.</p>
  <form id="f">
    <label for="senha">Nova senha</label>
    <input id="senha" type="password" minlength="8" required autofocus>
    <button type="submit" id="btn">Salvar nova senha</button>
  </form>
  <div class="msg" id="msg"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
const form = document.getElementById('f');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');
if (!token) { msg.textContent = 'Link inválido ou incompleto.'; msg.className = 'msg erro'; form.style.display = 'none'; }
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const senha = document.getElementById('senha').value;
  btn.disabled = true; btn.textContent = 'Salvando...';
  msg.textContent = ''; msg.className = 'msg';
  try {
    const r = await fetch('/api/auth/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password: senha }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.erro || 'Não foi possível redefinir a senha.');
    msg.textContent = 'Senha redefinida! Redirecionando...'; msg.className = 'msg ok';
    setTimeout(() => { location.href = '/app'; }, 900);
  } catch (err) {
    msg.textContent = err.message; msg.className = 'msg erro';
    btn.disabled = false; btn.textContent = 'Salvar nova senha';
  }
});
</script>
</body>
</html>
