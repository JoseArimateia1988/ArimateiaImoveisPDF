<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arimateia Imóveis – Apresentação</title>
<style>
  :root {
    --verde:  #243b2a;
    --cobre:  #7a4f2d;
    --creme:  #ede8df;
    --texto:  #1a1a1a;
    --suave:  #6b6b5e;
    --borda:  #ccc5b8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #d8d4cc; color: var(--texto); }

  /* ── ENTRADA ── */
  #tela-entrada {
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 2rem;
  }
  .card-entrada {
    background: var(--creme); border-radius: 4px; padding: 2.5rem;
    width: 100%; max-width: 600px; box-shadow: 0 4px 24px rgba(0,0,0,.15);
  }
  .logo-entrada { margin-bottom: 1.5rem; }
  .logo-entrada .nome {
    font-size: 1.4rem; font-weight: 800; color: var(--verde);
    letter-spacing: .12em; text-transform: uppercase;
  }
  .logo-entrada .sep { width: 40px; height: 2px; background: var(--cobre); margin: .5rem 0; }
  .logo-entrada .slogan { font-size: .78rem; color: var(--suave); letter-spacing: .05em; text-transform: uppercase; }
  .card-entrada p { color: var(--suave); font-size: .9rem; margin-bottom: 1.2rem; }
  textarea {
    width: 100%; height: 150px; padding: .85rem 1rem;
    border: 1.5px solid var(--borda); border-radius: 4px; background: #fff;
    font-size: .95rem; resize: vertical; line-height: 1.6; transition: border-color .2s;
  }
  textarea:focus { outline: none; border-color: var(--verde); }
  .btn-primario {
    margin-top: 1rem; width: 100%; padding: .9rem;
    background: var(--verde); color: var(--creme); border: none;
    border-radius: 4px; font-size: .9rem; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; cursor: pointer; transition: background .2s;
  }
  .btn-primario:hover { background: #1a2e1f; }
  .btn-primario:disabled { background: #888; cursor: not-allowed; }
  .status-msg { margin-top: .9rem; font-size: .85rem; color: var(--suave); text-align: center; min-height: 1.2rem; }
  .status-msg.erro { color: #c0392b; }

  /* ── RESULTADO ── */
  #tela-resultado { display: none; }
  .barra-topo {
    background: var(--verde); color: var(--creme);
    display: flex; align-items: center; justify-content: space-between;
    padding: .85rem 2rem; position: sticky; top: 0; z-index: 100;
  }
  .barra-topo h2 { font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
  .barra-acoes { display: flex; gap: .6rem; }
  .btn-barra {
    padding: .45rem 1rem; border-radius: 3px;
    border: 1px solid rgba(237,232,223,.4);
    background: transparent; color: var(--creme); font-size: .78rem;
    letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: background .15s;
  }
  .btn-barra:hover { background: rgba(237,232,223,.12); }
  .btn-barra.destaque { background: var(--cobre); border-color: var(--cobre); font-weight: 700; }
  .btn-barra.destaque:hover { background: #663f23; }

  /* ── DOCUMENTO ── */
  #documento { max-width: 860px; margin: 2rem auto 5rem; padding: 0 1rem; }

  /* CAPA */
  .capa {
    background: var(--verde); color: var(--creme);
    padding: .8rem 2rem; margin-bottom: 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 3px solid var(--cobre);
  }
  .capa h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .capa-data { font-size: .75rem; opacity: .6; letter-spacing: .06em; text-transform: uppercase; }

  /* CARD */
  .imovel-card {
    background: var(--creme); margin-bottom: 2rem;
    box-shadow: 0 2px 20px rgba(0,0,0,.12); page-break-after: always;
  }

  /* Galeria — grid uniforme 3 colunas, todas as fotos */
  .galeria-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
  }
  .galeria-grid img {
    width: 100%; height: 200px; object-fit: cover; display: block;
  }
  .galeria-vazia {
    height: 200px; background: #2a2a2a;
    display: flex; align-items: center; justify-content: center;
    color: #777; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase;
  }

  /* Cabeçalho verde do card */
  .card-header {
    background: var(--verde); color: var(--creme);
    padding: 1.4rem 2rem;
  }
  .card-header-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: .5rem;
  }
  .card-breadcrumb {
    font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--cobre); font-weight: 600;
  }
  .card-ref { font-size: .7rem; letter-spacing: .1em; color: var(--cobre); font-weight: 600; }
  .card-ref-destaque {
    font-size: .75rem; font-weight: 700; letter-spacing: .14em;
    color: var(--cobre); text-transform: uppercase; margin-bottom: .3rem;
  }
  .card-titulo {
    font-size: 1.5rem; font-weight: 800; letter-spacing: .01em;
    text-transform: uppercase; margin-top: .3rem; line-height: 1.2;
  }
  .card-endereco {
    margin-top: .4rem; font-size: .85rem; opacity: .75;
  }
  .card-endereco a { color: var(--creme); opacity: .75; text-decoration: underline; text-underline-offset: 3px; }
  .card-endereco a:hover { opacity: 1; }

  /* Tipologias */
  .tipologias-wrapper {
    padding: 1.4rem 2rem; border-bottom: 1px solid var(--borda);
  }
  .tipologias-titulo {
    font-size: .65rem; color: var(--suave); text-transform: uppercase;
    letter-spacing: .1em; font-weight: 700; margin-bottom: .8rem;
  }
  .tipologias-table {
    width: 100%; border-collapse: collapse; font-size: .85rem;
  }
  .tipologias-table th {
    text-align: left; font-size: .62rem; color: var(--suave);
    text-transform: uppercase; letter-spacing: .07em; font-weight: 600;
    padding: .45rem .8rem .45rem 0; border-bottom: 1px solid var(--borda);
    white-space: nowrap;
  }
  .tipologias-table th:not(:first-child) { text-align: center; }
  .tipologias-table td {
    padding: .65rem .8rem .65rem 0; border-bottom: 1px solid var(--borda);
    vertical-align: middle;
  }
  .tipologias-table td:not(:first-child) { text-align: center; color: var(--suave); }
  .tipologias-table tr:last-child td { border-bottom: none; }
  .td-preco { font-weight: 800; color: var(--texto); font-size: .95rem; white-space: nowrap; }
  .td-null { color: var(--borda); }

  /* Detalhes */
  .detalhes-wrapper { padding: 1.4rem 2rem; }

  .descricao { font-size: .88rem; line-height: 1.75; color: #444; margin-bottom: 1.2rem; }

  .descricao { font-size: .88rem; line-height: 1.75; color: #444; margin-bottom: 1.2rem; border-top: 1px solid var(--borda); padding-top: 1.2rem; }

  .tags { display: flex; flex-wrap: wrap; gap: .4rem; }
  .tag {
    border: 1px solid var(--borda); color: var(--suave);
    font-size: .72rem; padding: .25rem .7rem; border-radius: 2px;
    letter-spacing: .04em; text-transform: uppercase;
  }

  .card-rodape {
    background: var(--verde); color: var(--creme);
    padding: .65rem 2rem; display: flex; justify-content: space-between; align-items: center;
  }
  .card-rodape .marca { font-size: .7rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .card-rodape a { font-size: .68rem; color: rgba(237,232,223,.6); text-decoration: none; letter-spacing: .04em; }
  .card-rodape a:hover { color: var(--cobre); }

  /* Separador entre imóveis */
  .separador {
    height: 6px;
    background: var(--verde);
    margin: 2rem 0;
  }

  /* Erro */
  .imovel-erro {
    background: #fff5f5; border-left: 3px solid #dc2626;
    padding: 1.2rem 1.5rem; margin-bottom: 2rem; font-size: .88rem; color: #dc2626;
  }

  /* MOBILE */
  @media (max-width: 600px) {
    .barra-topo { padding: .7rem 1rem; flex-wrap: wrap; gap: .5rem; }
    .barra-topo h2 { font-size: .72rem; }
    .barra-acoes { gap: .4rem; }
    .btn-barra { padding: .4rem .65rem; font-size: .7rem; }
    #documento { margin: 1rem auto 5rem; padding: 0 .5rem; }
    .card-header { padding: 1rem 1.2rem; }
    .card-titulo { font-size: 1.1rem; }
    .galeria-grid { grid-template-columns: repeat(2, 1fr); }
    .galeria-grid img { height: 140px; }
    .tipologias-wrapper { padding: 1rem 1.2rem; overflow-x: auto; }
    .tipologias-table { font-size: .78rem; min-width: 420px; }
    .detalhes-wrapper { padding: 1rem 1.2rem; }
    .card-rodape { padding: .6rem 1.2rem; flex-wrap: wrap; gap: .3rem; }
    .capa { padding: .7rem 1.2rem; }
    .capa h1 { font-size: .9rem; }
    .tags { padding: 0 1.2rem 1rem; }
  }

  /* PRINT */
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body { background: #fff; }
    .barra-topo { display: none; }
    #documento { max-width: 100%; margin: 0; padding: 0; }
    .imovel-card { box-shadow: none; margin: 0; }
    .imovel-card { margin-bottom: 0; }
    .tipologias-wrapper { overflow-x: visible; }
  }
</style>
</head>
<body>

<!-- TELA LOGIN -->
<div id="tela-login" style="display:none;min-height:100vh;align-items:center;justify-content:center;background:#d8d4cc;">
  <div style="background:var(--creme);border-radius:4px;padding:2.5rem;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.15);text-align:center">
    <div style="font-size:1.1rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--verde);margin-bottom:.3rem">Arimateia Imóveis</div>
    <div style="width:40px;height:2px;background:var(--cobre);margin:.6rem auto 1.5rem"></div>
    <input id="login-senha" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')tentarLogin()"
      style="width:100%;border:1.5px solid var(--borda);border-radius:3px;padding:.7rem 1rem;font-size:.95rem;font-family:inherit;margin-bottom:.5rem;outline:none"/>
    <div id="login-erro" style="color:#c0392b;font-size:.8rem;margin-bottom:.5rem;display:none">Senha incorreta.</div>
    <button onclick="tentarLogin()" style="width:100%;background:var(--verde);color:var(--creme);border:none;padding:.75rem;border-radius:3px;font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer">Entrar</button>
  </div>
</div>

<!-- TELA 1: ENTRADA -->
<div id="tela-entrada" style="display:none">
  <div class="card-entrada">
    <div class="logo-entrada">
      <div class="nome">Arimateia Imóveis</div>
      <div class="sep"></div>
      <div class="slogan">Gerador de Apresentação</div>
    </div>
    <p>Cole um ou mais links da Lopes.com.br (um por linha) e gere uma apresentação profissional em PDF.</p>
    <textarea id="campo-urls" placeholder="https://www.lopes.com.br/imovel/...&#10;https://www.lopes.com.br/imovel/..."></textarea>
    <button class="btn-primario" id="btn-gerar">Gerar Apresentação</button>
    <button type="button" onclick="abrirHistorico()" style="width:100%;margin-top:.6rem;background:transparent;border:1.5px solid var(--borda);color:var(--verde);padding:.65rem;border-radius:3px;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer">📁 Minhas apresentações</button>
    <p class="status-msg" id="status"></p>
  </div>
</div>

<!-- TELA 3: HISTÓRICO -->
<div id="tela-historico" style="display:none;min-height:100vh;background:#d8d4cc;padding:2rem 1rem">
  <div style="max-width:680px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem">
      <div style="font-size:.95rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--verde)">📁 Minhas Apresentações</div>
      <button onclick="mostrarTela('entrada')" style="background:transparent;border:1.5px solid var(--borda);color:var(--suave);padding:.45rem 1rem;border-radius:3px;font-size:.78rem;cursor:pointer">← Voltar</button>
    </div>
    <div id="lista-historico"></div>
  </div>
</div>

<!-- TELA 2: RESULTADO -->
<div id="tela-resultado">
  <div class="barra-topo">
    <h2>Arimateia Imóveis — Apresentação</h2>
    <div class="barra-acoes">
      <button class="btn-barra" onclick="voltarInicio()">← Novo</button>
      <button class="btn-barra" id="btn-link" onclick="gerarLink()">🔗 Compartilhar</button>
      <button class="btn-barra destaque" id="btn-pdf" onclick="baixarPDF()">⬇ Baixar PDF</button>
    </div>
  </div>
  <div id="documento"></div>
</div>

<script>
const BACKEND = '';
let imoveisAtual = [];

// ── LOGIN ──
const SENHA_PDF = "t3teiA";
function tentarLogin(){
  const val = document.getElementById("login-senha").value;
  if(val === SENHA_PDF){
    localStorage.setItem("pdf_auth","1");
    document.getElementById("tela-login").style.display="none";
    document.getElementById("tela-entrada").style.display="flex";
  } else {
    document.getElementById("login-erro").style.display="block";
    document.getElementById("login-senha").value="";
  }
}
if(localStorage.getItem("pdf_auth")==="1"){
  document.getElementById("tela-entrada").style.display="flex";
} else {
  document.getElementById("tela-login").style.display="flex";
  document.getElementById("tela-entrada").style.display="none";
  setTimeout(()=>document.getElementById("login-senha").focus(),100);
}

document.getElementById('btn-gerar').addEventListener('click', async () => {
  const raw = document.getElementById('campo-urls').value.trim();
  const urls = raw.split('\n').map(u => u.trim()).filter(u => u.startsWith('http'));
  if (!urls.length) { setStatus('Cole pelo menos um link válido.', true); return; }

  const btn = document.getElementById('btn-gerar');
  btn.disabled = true;
  setStatus(`Buscando ${urls.length} imóvel(is)... aguarde alguns segundos.`);

  try {
    const resp = await fetch(`${BACKEND}/api/extrair`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls }),
    });
    if (!resp.ok) { const e = await resp.json(); throw new Error(e.erro || 'Erro no servidor'); }
    const { imoveis } = await resp.json();
    imoveisAtual = imoveis;
    renderizar(imoveis);
    mostrarTela('resultado');
  } catch (e) {
    setStatus(e.message || 'Erro ao conectar com o servidor.', true);
  } finally {
    btn.disabled = false;
  }
});

function setStatus(msg, erro = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status-msg' + (erro ? ' erro' : '');
}

function mostrarTela(nome) {
  document.getElementById('tela-entrada').style.display   = nome === 'entrada'   ? 'flex'  : 'none';
  document.getElementById('tela-resultado').style.display = nome === 'resultado' ? 'block' : 'none';
  document.getElementById('tela-historico').style.display = nome === 'historico' ? 'block' : 'none';
}

async function abrirHistorico() {
  mostrarTela('historico');
  const cont = document.getElementById('lista-historico');
  cont.innerHTML = '<p style="color:var(--suave);font-size:.85rem;text-align:center;padding:2rem">Carregando...</p>';
  try {
    const r = await fetch(`${BACKEND}/api/apresentacoes`);
    const lista = await r.json();
    if (!Array.isArray(lista) || !lista.length) {
      cont.innerHTML = '<p style="color:var(--suave);font-size:.85rem;text-align:center;padding:2rem">Nenhuma apresentação salva ainda. Gere uma e o link ficará guardado aqui.</p>';
      return;
    }
    const nomes = nomesApr();
    cont.innerHTML = lista.map(a => {
      const rs = a.resumo || {};
      const nome = nomes[a.id] || '';
      const titulo = esc(nome || rs.titulo || 'Apresentação');
      const sub = [rs.n ? rs.n + (rs.n > 1 ? ' imóveis' : ' imóvel') : null, rs.local, rs.preco ? 'a partir de ' + rs.preco : null].filter(Boolean).join(' · ');
      const data = a.criado_em ? new Date(a.criado_em).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
      const foto = rs.foto ? `<img src="${esc(rs.foto)}" onerror="this.style.display='none'" style="width:64px;height:64px;object-fit:cover;border-radius:3px;flex-shrink:0">` : '';
      const nomeAtual = esc(nome);
      return `<div style="background:var(--creme);border-radius:4px;padding:.9rem;margin-bottom:.7rem;box-shadow:0 1px 8px rgba(0,0,0,.08)">
        <div style="display:flex;gap:.8rem;align-items:flex-start">
          ${foto}
          <div style="flex:1;min-width:0">
            <div style="font-size:.7rem;color:var(--suave)">${data}</div>
            <div style="font-weight:700;font-size:.92rem;color:var(--verde);margin:.1rem 0">${titulo}</div>
            <div style="font-size:.78rem;color:var(--suave)">${esc(sub)}</div>
          </div>
        </div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem">
          <a href="/ver/${a.id}" target="_blank" style="flex:1;text-align:center;background:var(--verde);color:var(--creme);padding:.45rem;border-radius:3px;font-size:.75rem;text-decoration:none;min-width:120px">↗ Link do cliente</a>
          <a href="/resultado/${a.id}" target="_blank" style="flex:1;text-align:center;background:var(--cobre);color:#fff;padding:.45rem;border-radius:3px;font-size:.75rem;text-decoration:none;min-width:120px">📊 Resultado</a>
          <button onclick="copiarLink('/ver/${a.id}',this)" style="background:transparent;border:1.5px solid var(--borda);color:var(--suave);padding:.45rem .8rem;border-radius:3px;font-size:.75rem;cursor:pointer">Copiar</button>
        </div>
        <div style="display:flex;gap:.5rem;align-items:center;margin-top:.5rem">
          <input id="nome-${a.id}" value="${nomeAtual}" placeholder="Nome do cliente (opcional)" style="flex:1;padding:.4rem .6rem;border:1.5px solid var(--borda);border-radius:3px;font-size:.78rem;background:#fff">
          <button onclick="salvarNome('${a.id}',this)" style="background:transparent;border:1.5px solid var(--verde);color:var(--verde);padding:.4rem .8rem;border-radius:3px;font-size:.75rem;cursor:pointer">Salvar</button>
        </div>
      </div>`;
    }).join('');
  } catch {
    cont.innerHTML = '<p style="color:#c0392b;font-size:.85rem;text-align:center;padding:2rem">Erro ao carregar. Tente novamente.</p>';
  }
}

function copiarLink(path, btn) {
  navigator.clipboard.writeText(window.location.origin + path);
  const t = btn.textContent; btn.textContent = '✓';
  setTimeout(() => btn.textContent = t, 1500);
}

// Nomes dos clientes ficam guardados no navegador (não precisa de coluna no banco).
function nomesApr() { try { return JSON.parse(localStorage.getItem('apr_nomes') || '{}'); } catch { return {}; } }
function setNomeApr(id, nome) { const m = nomesApr(); if (nome) m[id] = nome; else delete m[id]; localStorage.setItem('apr_nomes', JSON.stringify(m)); }

function salvarNome(id, btn, inputId) {
  const val = document.getElementById(inputId || ('nome-' + id)).value.trim();
  setNomeApr(id, val);
  btn.textContent = '✓';
  setTimeout(() => { btn.textContent = 'Salvar'; }, 1500);
}

function voltarInicio() { mostrarTela('entrada'); setStatus(''); }

async function gerarLink() {
  const btn = document.getElementById('btn-link');
  btn.textContent = 'Gerando...';
  btn.disabled = true;
  try {
    const resp = await fetch(`${BACKEND}/api/salvar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imoveis: imoveisAtual }),
    });
    const { id } = await resp.json();
    const linkCliente = `${window.location.origin}/ver/${id}`;
    const linkResultado = `${window.location.origin}/resultado/${id}`;
    await navigator.clipboard.writeText(linkCliente);
    btn.textContent = '🔗 Compartilhar';
    btn.disabled = false;
    mostrarModal(linkCliente, linkResultado, id);
  } catch {
    btn.textContent = '🔗 Compartilhar';
    btn.disabled = false;
    alert('Erro ao gerar link.');
  }
}

async function mostrarModal(linkCliente, linkResultado, apresentacaoId) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:1rem';

  // Busca leads para o seletor
  let leads = [];
  try {
    const r = await fetch(`${BACKEND}/api/leads`);
    leads = await r.json();
  } catch {}

  const stageLabel = { novo:'Novo', contato:'Contato', visita:'Visita', proposta:'Proposta', parou:'Parou', fechado:'Fechado', perdido:'Perdido' };
  const opcoesLeads = leads.length
    ? leads.map(l => `<option value="${l.id}">${l.nome||'Sem nome'}${l.empreendimento?' · '+l.empreendimento:''} (${stageLabel[l.stage]||l.stage})</option>`).join('')
    : '<option disabled>Nenhum lead encontrado</option>';

  overlay.innerHTML = `
    <div style="background:var(--creme);border-radius:4px;padding:2rem;max-width:480px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.3)">
      <div style="font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--verde);margin-bottom:1.2rem">Links gerados</div>
      <div style="margin-bottom:1.2rem">
        <div style="font-size:.72rem;color:var(--suave);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem">🏷 Nome do cliente (para o histórico)</div>
        <div style="display:flex;gap:.5rem;align-items:center">
          <input id="nome-modal-${apresentacaoId}" placeholder="Ex: Bel, Jack, Fabíola..." style="flex:1;padding:.5rem .7rem;border:1.5px solid var(--borda);border-radius:3px;font-size:.8rem;background:#fff">
          <button onclick="salvarNome('${apresentacaoId}',this,'nome-modal-${apresentacaoId}')" style="padding:.5rem .9rem;background:var(--verde);color:var(--creme);border:none;border-radius:3px;font-size:.75rem;cursor:pointer;white-space:nowrap">Salvar</button>
        </div>
      </div>
      <div style="margin-bottom:1.2rem">
        <div style="font-size:.72rem;color:var(--suave);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem">📤 Link para o cliente</div>
        <div style="display:flex;gap:.5rem;align-items:center">
          <input id="inp-cliente" readonly value="${linkCliente}" style="flex:1;padding:.5rem .7rem;border:1.5px solid var(--borda);border-radius:3px;font-size:.8rem;background:#fff">
          <button onclick="copiar('inp-cliente',this)" style="padding:.5rem .9rem;background:var(--verde);color:var(--creme);border:none;border-radius:3px;font-size:.75rem;cursor:pointer;white-space:nowrap">Copiar</button>
        </div>
      </div>
      <div style="margin-bottom:1.2rem">
        <div style="font-size:.72rem;color:var(--suave);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem">📊 Link do resultado (só para você)</div>
        <div style="display:flex;gap:.5rem;align-items:center">
          <input id="inp-resultado" readonly value="${linkResultado}" style="flex:1;padding:.5rem .7rem;border:1.5px solid var(--borda);border-radius:3px;font-size:.8rem;background:#fff">
          <button onclick="copiar('inp-resultado',this)" style="padding:.5rem .9rem;background:var(--cobre);color:#fff;border:none;border-radius:3px;font-size:.75rem;cursor:pointer;white-space:nowrap">Copiar</button>
        </div>
      </div>
      <div style="border-top:1.5px solid var(--borda);padding-top:1.2rem;margin-bottom:1.2rem">
        <div style="font-size:.72rem;color:var(--suave);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem">🔗 Vincular a um lead no CRM</div>
        <div style="display:flex;gap:.5rem;align-items:center">
          <select id="sel-lead" style="flex:1;padding:.5rem .7rem;border:1.5px solid var(--borda);border-radius:3px;font-size:.8rem;background:#fff;color:#333">
            <option value="">Selecionar lead...</option>
            ${opcoesLeads}
          </select>
          <button id="btn-vincular" onclick="vincularLead('${apresentacaoId}',this)" style="padding:.5rem .9rem;background:var(--verde);color:var(--creme);border:none;border-radius:3px;font-size:.75rem;cursor:pointer;white-space:nowrap">Vincular</button>
        </div>
        <div id="msg-vincular" style="font-size:.75rem;margin-top:.4rem;min-height:1rem"></div>
      </div>
      <button onclick="this.closest('[data-modal]').remove()" style="width:100%;padding:.6rem;background:transparent;border:1.5px solid var(--borda);border-radius:3px;font-size:.8rem;cursor:pointer;color:var(--suave)">Fechar</button>
    </div>`;
  overlay.setAttribute('data-modal','');
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

async function vincularLead(apresentacaoId, btn) {
  const leadId = document.getElementById('sel-lead').value;
  const msg = document.getElementById('msg-vincular');
  if (!leadId) { msg.style.color = 'var(--cobre)'; msg.textContent = 'Selecione um lead primeiro.'; return; }
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const r = await fetch(`${BACKEND}/api/vincular`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ leadId: Number(leadId), apresentacaoId }),
    });
    if (r.ok) {
      msg.style.color = 'var(--verde)';
      msg.textContent = '✓ Vinculado com sucesso!';
      btn.textContent = '✓';
    } else {
      throw new Error('Erro do servidor');
    }
  } catch {
    msg.style.color = 'var(--cobre)';
    msg.textContent = 'Erro ao vincular. Tente novamente.';
    btn.disabled = false;
    btn.textContent = 'Vincular';
  }
}

function copiar(inputId, btn) {
  const inp = document.getElementById(inputId);
  inp.select();
  navigator.clipboard.writeText(inp.value);
  btn.textContent = '✓ Copiado';
  setTimeout(() => btn.textContent = 'Copiar', 2000);
}

// Reduz uma <img> via canvas (max 1000px de largura, JPEG 70%) para um PDF leve.
function reduzirImg(img) {
  return new Promise(resolve => {
    const orig = img.dataset.orig || img.src;
    img.dataset.orig = orig;
    if (orig.startsWith('data:')) return resolve();
    const tmp = new Image();
    tmp.crossOrigin = 'anonymous';
    tmp.onload = () => {
      try {
        const maxW = 1000;
        const escala = Math.min(1, maxW / tmp.naturalWidth);
        const c = document.createElement('canvas');
        c.width = Math.round(tmp.naturalWidth * escala);
        c.height = Math.round(tmp.naturalHeight * escala);
        c.getContext('2d').drawImage(tmp, 0, 0, c.width, c.height);
        img.src = c.toDataURL('image/jpeg', 0.7);
      } catch {}
      resolve();
    };
    tmp.onerror = () => resolve();
    // Passa pelo proxy do backend para liberar CORS e permitir o canvas
    tmp.src = '/img?u=' + encodeURIComponent(orig);
  });
}

async function baixarPDF() {
  const btn = document.getElementById('btn-pdf');
  const txt = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Preparando…';
  try {
    const imgs = [...document.querySelectorAll('#documento img')];
    await Promise.all(imgs.map(reduzirImg));
  } catch {}
  btn.disabled = false;
  btn.textContent = txt;
  window.print();
}

function renderizar(imoveis) {
  const ok = imoveis.filter(i => i.ok).map(i => i.dados);
  const doc = document.getElementById('documento');
  doc.innerHTML = '';

  const hoje = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
  const subtitulo = ok.length > 1 ? `${ok.length} Imóveis Selecionados` : '';
  doc.innerHTML = `
    <div class="capa">
      <h1>Arimateia Imóveis</h1>
      <div class="capa-data">${hoje}${subtitulo ? ' · ' + esc(subtitulo) : ''}</div>
    </div>`;

  imoveis.forEach((item, i) => {
    if (i > 0) {
      const sep = document.createElement('div');
      sep.className = 'separador';
      doc.appendChild(sep);
    }
    if (!item.ok) {
      doc.innerHTML += `<div class="imovel-erro"><strong>Não foi possível extrair dados</strong><br>${esc(item.url)}<br><small>${esc(item.erro)}</small></div>`;
      return;
    }
    doc.appendChild(card(item.dados));
  });
}

function card(d) {
  const el = document.createElement('div');
  el.className = 'imovel-card';

  // Galeria
  const fotos = (d.fotos || []).filter(Boolean);
  const gal = fotos.length
    ? `<div class="galeria-grid">${fotos.map(s => `<img src="${esc(s)}" loading="lazy" onerror="this.style.display='none'">`).join('')}</div>`
    : `<div class="galeria-vazia">Fotos não disponíveis</div>`;

  // Cabeçalho
  const tips = (d.tipologias || []);
  const temVenda = tips.some(t => t.preco_venda);
  const temAluguel = tips.some(t => t.preco_aluguel);
  const breadcrumb = [d.bairro, d.cidade, temVenda ? 'Venda' : temAluguel ? 'Locação' : null].filter(Boolean).join(' · ');
  const mapsUrl = d.endereco ? `https://maps.google.com/?q=${encodeURIComponent((d.endereco||'') + (d.cidade ? ', '+d.cidade : ''))}` : null;
  const enderecoHtml = d.endereco
    ? (mapsUrl ? `<a href="${esc(mapsUrl)}" target="_blank">📍 ${esc(d.endereco)}</a>` : `📍 ${esc(d.endereco)}`)
    : '';
  const refHtml = d.codigo ? `<div class="card-ref-destaque">${esc(d.codigo)}</div>` : '';

  // Tabela de tipologias
  let tipologiasHtml = '';
  if (tips.length) {
    // Colunas fixas na ordem certa: preço | m² | dorms | suítes | vagas | cond.
    const cols = [
      { key: 'preco_venda',   label: 'A partir de',  fallback: 'preco_aluguel' },
      { key: 'area_util',     label: 'm²',            fallback: 'area_total'   },
      { key: 'quartos',       label: '🛏 Dorms'                                },
      { key: 'suites',        label: '🚿 Suítes'                               },
      { key: 'vagas',         label: '🚗 Vagas'                                },
      { key: 'condominio',    label: 'Cond.'                                   },
    ].filter(c => tips.some(t => t[c.key] != null || (c.fallback && t[c.fallback] != null)));

    const thead = cols.map(c => `<th>${c.label}</th>`).join('');
    const tbody = tips.map(t => {
      const tds = cols.map(c => {
        const v = t[c.key] ?? (c.fallback ? t[c.fallback] : null);
        if (v == null) return `<td class="td-null">—</td>`;
        if (c.key === 'preco_venda' || c.key === 'preco_aluguel') return `<td class="td-preco">${esc(String(v))}</td>`;
        return `<td>${esc(String(v))}</td>`;
      }).join('');
      return `<tr>${tds}</tr>`;
    }).join('');

    tipologiasHtml = `
      <div class="tipologias-wrapper">
        <div class="tipologias-titulo">Tipologias disponíveis</div>
        <table class="tipologias-table"><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table>
      </div>`;
  }

  const tags = (d.caracteristicas || []).slice(0, 16).map(t => `<span class="tag">${esc(t)}</span>`).join('');

  el.innerHTML = `
    <div class="card-header">
      <div class="card-header-top">
        ${breadcrumb ? `<div class="card-breadcrumb">${esc(breadcrumb)}</div>` : '<div></div>'}
      </div>
      ${refHtml}
      <div class="card-titulo">${esc(d.titulo || 'Imóvel')}</div>
      ${enderecoHtml ? `<div class="card-endereco">${enderecoHtml}</div>` : ''}
    </div>
    ${tipologiasHtml}
    ${gal}
    <div class="detalhes-wrapper">
      ${d.descricao ? `<p class="descricao">${esc(d.descricao)}</p>` : ''}
      ${tags ? `<div class="tags">${tags}</div>` : ''}
    </div>
    <div class="card-rodape">
      <span class="marca">Arimateia Imóveis</span>
      ${d.url_origem ? `<a href="${esc(d.url_origem)}" target="_blank">Ver anúncio original</a>` : ''}
    </div>`;

  return el;
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
