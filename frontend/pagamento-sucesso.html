<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152b22"><title>Retorno do pagamento | Busca Certa</title><style>body{margin:0;background:#fbf6ee;color:#1f2924;font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fffdf8;border:1px solid #ddd2c3;border-radius:24px;padding:34px;box-shadow:0 24px 70px rgba(31,41,36,.1)}.brand{display:flex;align-items:center;gap:10px;color:#152b22;font:500 22px Georgia,serif;text-decoration:none}.mark{width:34px;height:34px;border:1px solid #c4935f;border-radius:11px 11px 11px 3px;display:grid;place-items:center;color:#c66b3f;font:700 10px Inter,sans-serif}.tag{margin-top:28px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:#66806f}.icon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#e7efe9;color:#152b22;font-size:28px;margin:12px 0}h1{font:500 38px/1.05 Georgia,serif;letter-spacing:-.035em;margin:0 0 12px;color:#152b22}p{font-size:14px;line-height:1.6;color:#6f756f;margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:11px;text-decoration:none;font-size:12px;font-weight:850;border:0;cursor:pointer;font-family:inherit}.primary{background:#152b22;color:#fff}.secondary{border:1px solid #ddd2c3;color:#152b22;background:#fff}.note{margin-top:18px;padding-top:16px;border-top:1px solid #eee4d7;font-size:11px;color:#858b86}</style></head><body><main class="wrap"><section class="card">
<a class="brand" href="/"><span class="mark">BC</span>Busca Certa</a>
<div class="tag" id="tag">Confirmando pagamento</div>
<div class="icon" id="icon">…</div>
<h1 id="titulo">Confirmando seu pagamento...</h1>
<p id="texto">Estamos consultando o status direto com o Mercado Pago. Isso leva só alguns segundos.</p>
<div class="actions" id="acoes"></div>
<div class="note" id="nota"></div>
</section></main>
<script>
const tag=document.getElementById('tag'),icon=document.getElementById('icon'),titulo=document.getElementById('titulo'),texto=document.getElementById('texto'),acoes=document.getElementById('acoes'),nota=document.getElementById('nota');
function estadoAprovado(){tag.textContent='Pagamento confirmado';icon.textContent='✓';titulo.textContent='Deu certo.';texto.textContent='Seu pagamento foi confirmado e sua assinatura já está ativa.';acoes.innerHTML='<a class="btn primary" href="/app">Ir para o painel</a>';nota.textContent=''}
function estadoPendente(){tag.textContent='Pagamento em processamento';icon.textContent='⏳';titulo.textContent='Quase lá.';texto.textContent='Recebemos seu pedido, mas o Mercado Pago ainda está processando a confirmação. Isso pode levar alguns minutos.';acoes.innerHTML='<button class="btn primary" id="btn-checar">Checar novamente</button><a class="btn secondary" href="/app">Ir para o painel</a>';nota.textContent='Assim que a confirmação chegar, o acesso libera automaticamente — não precisa pagar de novo.';document.getElementById('btn-checar')?.addEventListener('click',checar)}
function estadoSemConta(){tag.textContent='Confirme sua conta';icon.textContent='?';titulo.textContent='Falta entrar na sua conta.';texto.textContent='Não conseguimos identificar sua sessão. Entre na sua conta para vermos o status do seu pagamento.';acoes.innerHTML='<a class="btn primary" href="/login">Entrar</a>';nota.textContent=''}
function estadoSemPagamento(){tag.textContent='Ainda não encontramos seu pagamento';icon.textContent='?';titulo.textContent='Não encontramos esse pagamento ainda.';texto.textContent='Se você acabou de pagar, aguarde um instante e tente checar de novo — às vezes a confirmação demora um pouco a mais.';acoes.innerHTML='<button class="btn primary" id="btn-checar">Checar novamente</button><a class="btn secondary" href="/pagar">Voltar para o pagamento</a>';document.getElementById('btn-checar')?.addEventListener('click',checar)}
function estadoErro(){tag.textContent='Não foi possível confirmar';icon.textContent='!';titulo.textContent='Algo deu errado ao consultar.';texto.textContent='Tente novamente em instantes. Se persistir, fale com o suporte.';acoes.innerHTML='<button class="btn primary" id="btn-checar">Tentar de novo</button>';document.getElementById('btn-checar')?.addEventListener('click',checar)}

async function checar(){
  tag.textContent='Confirmando pagamento';icon.textContent='…';titulo.textContent='Confirmando seu pagamento...';texto.textContent='Estamos consultando o status direto com o Mercado Pago.';acoes.innerHTML='';nota.textContent='';
  try{
    const me=await fetch('/api/auth/me');
    if(!me.ok){estadoSemConta();return}
    const r=await fetch('/api/mercadopago/status');
    if(!r.ok){estadoErro();return}
    const d=await r.json();
    if(d.active){estadoAprovado();return}
    if(d.payment&&['pending','in_process'].includes(String(d.payment.status||'').toLowerCase())){estadoPendente();return}
    estadoSemPagamento();
  }catch{estadoErro()}
}
checar();
</script>
</body></html>
