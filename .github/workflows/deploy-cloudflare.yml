name: Deploy Busca Certa Cloudflare

on:
  push:
    branches:
      - busca-certa-cloudflare
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: busca-certa-homol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Install Wrangler
        run: npm install --ignore-scripts
      - name: Validate Worker before deploy
        run: npx wrangler deploy --dry-run
      - name: Sync Anthropic secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler versions secret put ANTHROPIC_API_KEY
          else
            echo "ANTHROPIC_API_KEY não configurado nos secrets do GitHub — pulando (não sobrescreve o valor já publicado)."
          fi
      - name: Sync Mercado Pago secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
        run: |
          if [ -n "$MERCADOPAGO_ACCESS_TOKEN" ]; then
            printf '%s' "$MERCADOPAGO_ACCESS_TOKEN" | npx wrangler versions secret put MERCADOPAGO_ACCESS_TOKEN
          else
            echo "MERCADOPAGO_ACCESS_TOKEN não configurado nos secrets do GitHub — pulando (não sobrescreve o valor já publicado)."
          fi
      - name: Sync Mercado Pago webhook secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
        run: |
          if [ -n "$MERCADOPAGO_WEBHOOK_SECRET" ]; then
            printf '%s' "$MERCADOPAGO_WEBHOOK_SECRET" | npx wrangler versions secret put MERCADOPAGO_WEBHOOK_SECRET
          else
            echo "MERCADOPAGO_WEBHOOK_SECRET não configurado nos secrets do GitHub — a assinatura do webhook fica sem validar até isso ser configurado."
          fi
      - name: Sync Resend secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler versions secret put RESEND_API_KEY
          else
            echo "RESEND_API_KEY não configurado nos secrets do GitHub — pulando (não sobrescreve o valor já publicado)."
          fi
      - name: Sync remetente de e-mail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUSCA_CERTA_EMAIL: ${{ secrets.BUSCA_CERTA_EMAIL }}
        run: |
          if [ -n "$BUSCA_CERTA_EMAIL" ]; then
            printf 'Busca Certa <%s>' "$BUSCA_CERTA_EMAIL" | npx wrangler versions secret put EMAIL_FROM
          else
            echo "BUSCA_CERTA_EMAIL não configurado nos secrets do GitHub — pulando (não sobrescreve o valor já publicado)."
          fi
      - name: Sync admin secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUSCA_CERTA_ADMIN_TOKEN: ${{ secrets.BUSCA_CERTA_ADMIN_TOKEN }}
        run: |
          if [ -n "$BUSCA_CERTA_ADMIN_TOKEN" ]; then
            printf '%s' "$BUSCA_CERTA_ADMIN_TOKEN" | npx wrangler versions secret put BUSCA_CERTA_ADMIN_TOKEN
          else
            echo "BUSCA_CERTA_ADMIN_TOKEN não configurado nos secrets do GitHub — pulando (não sobrescreve o valor já publicado)."
          fi
      - name: Deploy homolog to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
