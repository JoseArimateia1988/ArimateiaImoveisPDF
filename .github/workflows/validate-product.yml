name: Validate product branch

on:
  push:
    branches: [produto-v1-review-pdf, busca-certa-visual, busca-certa-d1, busca-certa-cloudflare]
  pull_request:
    branches: [main, busca-certa-d1]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: imoveis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d imoveis_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/imoveis_test
      DATABASE_SSL: "false"
      NODE_ENV: test
      ORULO_SHARE_LINKS_ENABLED: "false"
      ENABLE_TEST_ENDPOINTS: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install backend dependencies
        run: npm install
      - name: Check backend syntax
        run: |
          node --check server.js
          node --check worker.js
          node --check pages.js
          node --check pages-v2.js
          node --check client-v2.js
          node --check client-v4.js
          node --check result-v2.js
          node --check auth.js
          node --check db.js
          node --check d1.js
          node --check usage.js
          node --check orulo.js
          node --check scraper.js
          node --check claude.js
          node --check smoke-test.mjs
          node --check visual-smoke-test.mjs
      - name: Check frontend JavaScript syntax
        run: |
          node --check ../frontend/v1.js
          node --check ../frontend/qa-fixes.js
      - name: Run visual model smoke test
        run: node visual-smoke-test.mjs
      - name: Start test server
        run: |
          node server.js > /tmp/imoveis-server.log 2>&1 &
          echo $! > /tmp/imoveis-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3001/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/imoveis-server.log
          exit 1
      - name: Check public pages
        run: |
          curl -fsS http://127.0.0.1:3001/ > /dev/null
          curl -fsS http://127.0.0.1:3001/termos > /dev/null
          curl -fsS http://127.0.0.1:3001/privacidade > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/planos)" = "302"
      - name: Run SaaS smoke test
        run: node smoke-test.mjs
      - name: Validate Cloudflare bundle
        working-directory: .
        run: |
          npm install --ignore-scripts
          npx wrangler deploy --dry-run
      - name: Start local Cloudflare Worker
        working-directory: .
        env:
          DATABASE_URL: ""
          DATABASE_SSL: ""
          NODE_ENV: ""
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 --var ENABLE_TEST_ENDPOINTS:true > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1
      - name: Run Worker + D1 smoke test
        working-directory: .
        env:
          TEST_BASE_URL: http://127.0.0.1:8787
          EXPECTED_DATABASE: d1
        run: node backend/smoke-test.mjs
      - name: Show logs on failure
        if: failure()
        working-directory: .
        run: |
          cat /tmp/imoveis-server.log || true
          cat /tmp/wrangler.log || true
