name: Validate product branch

on:
  push:
    branches: [produto-v1-review-pdf, busca-certa-visual]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: imoveis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d imoveis_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/imoveis_test
      DATABASE_SSL: "false"
      NODE_ENV: test
      ORULO_SHARE_LINKS_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install
      - name: Check backend syntax
        run: |
          node --check server.js
          node --check pages.js
          node --check auth.js
          node --check db.js
          node --check usage.js
          node --check orulo.js
          node --check scraper.js
          node --check claude.js
          node --check smoke-test.mjs
      - name: Check frontend JavaScript syntax
        run: node --check ../frontend/v1.js
      - name: Start test server
        run: |
          node server.js > /tmp/imoveis-server.log 2>&1 &
          echo $! > /tmp/imoveis-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3001/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/imoveis-server.log
          exit 1
      - name: Run SaaS smoke test
        run: node smoke-test.mjs
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/imoveis-server.log || true
